# Builds the static binary with the pinned toolchain (rust-toolchain.toml), checks that a second build from another
# directory gives the same bytes, and on a v* tag publishes the binary with SHA256SUMS. Anyone can rebuild a release
# with ./build.sh and compare.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash  # explicit bash adds -o pipefail, so `./build.sh | tee` fails when the build does
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: ./build.sh | tee build.txt
      - name: Same bytes from another directory
        run: |
          mkdir -p /tmp/second && git archive HEAD | tar -x -C /tmp/second
          /tmp/second/build.sh | tail -1 | tee second.txt
          [ "$(tail -1 build.txt | cut -d' ' -f1)" = "$(cut -d' ' -f1 second.txt)" ]
      - name: Package
        run: |
          mkdir dist && cp target/x86_64-unknown-linux-musl/release/vpnrelay dist/vpnrelay-x86_64-linux-musl
          (cd dist && sha256sum vpnrelay-x86_64-linux-musl > SHA256SUMS)
          head -1 build.txt > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vpnrelay
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vpnrelay
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --notes "Static x86_64 build ($(cat dist/BUILD-INFO.txt)). SHA-256: $(cat dist/SHA256SUMS)" \
            dist/vpnrelay-x86_64-linux-musl dist/SHA256SUMS
